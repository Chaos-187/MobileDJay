# Deploy MobileDJay to the self-hosted server via a local GitHub Actions runner.
#
# Prerequisites on the server:
#   1. GitHub Actions self-hosted runner registered for this repo (label: self-hosted)
#   2. Node.js 20+ and npm
#   3. pm2 installed globally (`npm install -g pm2`)
#   4. App directory exists with .env and live data:
#        /home/kyle/Documents/MobileDJay-main/
#
# Optional repo Variables (Settings → Secrets and variables → Actions → Variables):
#   DEPLOY_PATH   — override deploy directory (default below)
#   PM2_APP_NAME  — pm2 process name if not "mobiledjay"

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-mobiledjay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: self-hosted

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/kyle/Documents/MobileDJay-main' }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'mobiledjay' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync application files
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"

          rsync -av --delete \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'uploads/' \
            --exclude 'db/*.db' \
            --exclude 'db/*.sqlite' \
            --exclude 'db/*.sqlite3' \
            --exclude 'logs/' \
            --exclude '*.log' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/"

      - name: Install production dependencies
        working-directory: ${{ env.DEPLOY_PATH }}
        run: bash scripts/deploy.sh --install-only
